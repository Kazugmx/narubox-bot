services:
  postgres:
    image: postgres:16-alpine
    container_name: narubox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: narubox_dev
      POSTGRES_USER: narubox
      POSTGRES_PASSWORD: narubox_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U narubox -d narubox_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
